name: Setup build
description: JDK 17, Gradle, dan unduhan Gradle wrapper dengan retry (unduhan dari GitHub kadang 504 atau timeout)

runs:
  using: composite
  steps:
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: "17"

    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - name: Perpanjang timeout dan retry unduhan dependency
      shell: bash
      run: |
        gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
        mkdir -p "$gradle_home"
        cat >> "$gradle_home/gradle.properties" <<'EOF'
        systemProp.org.gradle.internal.http.connectionTimeout=60000
        systemProp.org.gradle.internal.http.socketTimeout=60000
        systemProp.org.gradle.internal.repository.max.retries=6
        systemProp.org.gradle.internal.repository.initial.backoff=2000
        EOF

    - name: Siapkan Gradle wrapper (retry)
      shell: bash
      run: |
        # gradle-wrapper.properties memakai networkTimeout 10 detik; satu unduhan gagal tidak boleh menggagalkan job.
        for attempt in 1 2 3 4 5; do
          if ./gradlew --version; then
            exit 0
          fi
          echo "Unduhan Gradle gagal (percobaan ${attempt} dari 5); mencoba lagi..."
          sleep $((attempt * 15))
        done
        echo "Gradle wrapper tidak dapat diunduh setelah 5 percobaan"
        exit 1
