# Builds, tests and publishes id.art.tracker:artracker-android to GitHub Packages when a version tag is pushed.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag must equal "v" + the `sdkVersion` in artracker-sdk/build.gradle.kts. Nothing else triggers this workflow and
# there is no manual trigger, so a publish always corresponds to a tag.
# Credentials: only the workflow's own GITHUB_TOKEN (scoped to `packages: write` in the publish job). No secret has to be
# created and nothing is stored in the repository. See docs/releasing.md.
name: Publish to GitHub Packages

on:
  push:
    tags:
      - "v*"

# Default for every job: read-only. The publish job raises it for itself.
permissions:
  contents: read

# Two pushes of the same tag must not publish in parallel; never cancel a publish that is already running.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # Passed through the environment (not interpolated into the scripts below) so a crafted tag name cannot inject commands.
  TAG_NAME: ${{ github.ref_name }}

jobs:
  verify:
    name: Build, test and validate the artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Tag must match the SDK version
        run: |
          sdk_version="$(./gradlew -q :artracker-sdk:printSdkVersion | tail -n1 | tr -d '[:space:]')"
          if [[ "$TAG_NAME" != "v$sdk_version" ]]; then
            echo "::error::Tag '$TAG_NAME' does not match the SDK version 'v$sdk_version' (artracker-sdk/build.gradle.kts)."
            exit 1
          fi
          echo "Releasing $sdk_version from tag $TAG_NAME"

      - name: Build and unit tests
        run: ./gradlew --stacktrace :artracker-sdk:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug

      - name: Validate the publication in a local Maven repository
        # Publishes to build/verify-m2 (never to GitHub), checks aar/pom/module/dependencies, then builds throw-away
        # consumer apps (AGP 9 minified, and AGP 8 + Kotlin 2.0.21) that resolve the artifact only from that repository.
        run: scripts/verify-publication.sh --legacy-consumer

      - name: Keep the validated artifact files
        uses: actions/upload-artifact@v7
        with:
          name: validated-maven-repo
          path: build/verify-m2/id/art/tracker/artracker-android
          if-no-files-found: error
          retention-days: 14

      - name: Keep test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            artracker-sdk/build/reports/tests
            app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish
        # build.gradle.kts reads GITHUB_ACTOR / GITHUB_TOKEN / GITHUB_REPOSITORY from the environment.
        # GitHub Packages never overwrites a version: re-running this job after a successful publish fails with 409.
        run: ./gradlew --stacktrace :artracker-sdk:publishReleasePublicationToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
